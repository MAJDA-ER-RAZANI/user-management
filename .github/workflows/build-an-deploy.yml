name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build, Analyze, and Deploy
    runs-on: self-hosted

    steps:
      # Checkout code
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Setup JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Setup Maven
      - name: Setup Maven
        shell: powershell
        run: |
          echo "MAVEN_HOME=$env:USERPROFILE\maven\apache-maven-3.8.8" >> $env:GITHUB_ENV
          echo "$env:USERPROFILE\maven\apache-maven-3.8.8\bin" >> $env:GITHUB_PATH

      # Build & SonarQube analysis
      - name: Build and analyze
        shell: cmd
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          mvn -B verify sonar:sonar -Dsonar.project.settings=./sonar-project.properties

      # 🔥 IMPORTANT: Disable Docker BuildKit
      - name: Disable Docker BuildKit
        shell: powershell
        run: |
          echo "DOCKER_BUILDKIT=0" >> $env:GITHUB_ENV

      # Build Docker image
      - name: Build Docker image
        run: |
          docker build -t carikk/quality-gate:latest .

      # Login to DockerHub (SECURE)
      - name: Log in to DockerHub
        shell: powershell
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      # Push image
      - name: Push Docker image
        run: |
          docker push carikk/quality-gate:latest

      # Setup kubeconfig
      - name: Set up kubeconfig
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path $HOME\.kube
          echo "${{ secrets.KUBECONFIG_CONTENT }}" > $HOME\.kube\config
          kubectl config use-context docker-desktop
          kubectl config set-context --current --namespace=ensakh

      # Verify Kubernetes context
      - name: Verify Kubernetes context
        run: |
          kubectl config current-context
          kubectl get namespaces

      # Deploy
      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/deployment.yaml

      # Verify deployment
      - name: Verify Kubernetes deployment
        run: |
          kubectl get pods
          kubectl get services
