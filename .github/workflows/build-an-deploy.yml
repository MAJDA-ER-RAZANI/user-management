name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build, Analyze, Docker Build & Push, Deploy to Kubernetes
    runs-on: self-hosted   # Votre runner local auto-hébergé

    steps:
      # 1. Checkout du code
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  

      # 2. Setup Java 21 (plus fiable que setup-java@v1 qui est ancien)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'   # Eclipse Temurin 
          java-version: '21'
          cache: 'maven'            # Cache automatique des dépendances Maven

      # 3. Build + Analyse SonarQube
      - name: Build and SonarQube Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          mvn -B verify sonar:sonar -Dsonar.projectKey=user-management -Dsonar.host.url=$SONAR_HOST_URL -Dsonar.login=$SONAR_TOKEN
        shell: bash   # bash est généralement disponible sur les runners self-hosted

      # 4. Build de l'image Docker
      - name: Build Docker image
        run: |
          docker build -t carikk/quality-gate:latest .

      # 5. Login Docker Hub (méthode recommandée et sécurisée)
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}   # Préférez un Access Token Docker Hub ici

      # 6. Push de l'image Docker
      - name: Push Docker image to Docker Hub
        run: |
          docker push carikk/quality-gate:latest

      # 7. Configuration Kubernetes (Docker Desktop context)
      - name: Setup kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG_CONTENT }}" > $HOME/.kube/config
          kubectl config use-context docker-desktop
          kubectl config set-context --current --namespace=ensakh

      # 8. Vérification du contexte Kubernetes
      - name: Verify Kubernetes context and cluster access
        run: |
          echo "Current context:"
          kubectl config current-context
          echo "Namespaces:"
          kubectl get namespaces
          echo "Nodes:"
          kubectl get nodes

      # 9. Déploiement sur Kubernetes
      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/deployment.yaml

      # 10. Vérification finale des pods
      - name: Check deployed pods
        run: |
          kubectl get pods -n ensakh
          kubectl get services -n ensakh